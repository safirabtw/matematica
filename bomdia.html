<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; font-size: 16px; padding: 10px; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.9em; line-height: 1.1; margin: 0 2px; }
  .num { border-bottom: 1px solid #fff; padding-bottom: 1px; }
  .den { padding-top: 1px; }
  .step { margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="step">Aplicando cosseno a ambos os membros:</div>
  <div class="step">
    cos(<span class="frac"><span class="num">y</span><span class="den">3</span></span>) = 
    <span class="frac"><span class="num">7x</span><span class="den">4</span></span>
  </div>
  <div class="step">
    x = <span class="frac"><span class="num">4</span><span class="den">7</span></span> 
    cos(<span class="frac"><span class="num">y</span><span class="den">3</span></span>)
  </div>
  <div class="step">Trocando <i>x</i> por <i>y</i> (função inversa):</div>
  <div class="step">
    <i>f</i><sup>-1</sup>(<i>x</i>) = 
    <span class="frac"><span class="num">4</span><span class="den">7</span></span> 
    cos(<span class="frac"><span class="num">x</span><span class="den">3</span></span>)
  </div>
</body>
</html>
